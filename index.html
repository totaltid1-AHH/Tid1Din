<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Tid1Din - Sikkert kundeoppfølgings- og bookingsystem for behandling og veiledning" />

    <title>Tid1Din - Kundeoppfølging & Timebooking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var k of keys) { caches.delete(k); }
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
